<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="CSS Style/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="Css Style/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="CSS Style/favicon/favicon-16x16.png">
    <link rel="manifest" href="CSS Style/manifest.json">
    <link rel="mask-icon" href="CSS Syle/favicon/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="apple-mobile-web-app-title" content="Carewell Hospital">
    <meta name="application-name" content="Carewell Hospital">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="./CSS Style/Main.css">
    <link rel="stylesheet" href="./CSS Style/Checkout.css">
    <title>Checkout  - Carewell Hospital</title>
</head>
<body>
    <header>
        <nav>
            <div class="menu">
                <img src="Images/Logo1.png" alt="carewell's logo" class="logo">
            </div>
        </nav>
    </header>
    <main>
        <form id="order-form" class="order-form">
            <h2>Order Details</h2>
        
            <!-- Personal Details Card -->
            <div class="card personal-details">
                <h2>Personal Details</h2>
                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" name="full-name" placeholder="Enter full name" required>
        
                <label for="age">Age</label>
                <input type="number" id="age" name="age" placeholder="Enter your age" min="18" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
        
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter phone number" maxlength="10" required>
            </div>
        
            <!-- Delivery Method Card -->
            <div class="card delivery-method">
                <h2>Delivery Method</h2>
                <label>
                    <input type="radio" name="delivery-method" value="pickup" id="pickup" required>
                    Pickup
                </label>
                <label>
                    <input type="radio" name="delivery-method" value="delivery" id="delivery" required>
                    Delivery
                </label>
        
                <!-- Delivery Details -->
                <div id="delivery-address" class="address-fields">
                    <label for="address">Street Address</label>
                    <input type="text" id="address" name="address">
        
                    <label for="city">City</label>
                    <input type="text" id="city" name="city">
        
                    <label for="zipcode">Postal Code/ZIP</label>
                    <input type="text" id="zipcode" name="zipcode">
        
                    <label for="country">Country/State</label>
                    <input type="text" id="country" name="country">
        
                    <label for="additional-details">Additional Details</label>
                    <textarea name="additional-details" id="additional-details" cols="60" rows="5"></textarea>
                </div>
            </div>
            
            <!-- Payment Method Card -->
            <div class="card payment-method">
                <h2>Payment Method</h2>
                <label>
                    <input type="radio" name="payment-method" value="card" id="payment-card" required>
                    Credit/Debit Card
                </label>
                <label>
                    <input type="radio" name="payment-method" value="cash" id="payment-cash" required>
                    Cash on Delivery
                </label>
        
                <!-- Card Details -->
                <div id="card-details" class="details-card">
                    <label for="card-number">Card Number</label>
                    <input type="number" id="card-number" name="card-number" required>
        
                    <label for="expiry-date">Expiry Date</label>
                    <input type="month" id="expiry-date" name="expiry-date" placeholder="MM/YY" min="2025-01" required>
        
                    <label for="cvv">CVV</label>
                    <input type="number" id="cvv" name="cvv" required>
                </div>
            </div>

            <!-- Order Summary Table -->
            <div id="order-summary">
                <table id="summary-table">
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>Unit Price (LKR)</th>
                            <th>Quantity</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="summary-table-body">
                        <!-- Dynamically filled with order items -->
                    </tbody>
                </table>
        
                <div class="grand-total">
                    <p>Total: <span id="grand-total">0.00</span></p>
                </div>

                <button id="pay-button" type="submit">Confirm Payment</button>
        
            </div>
        </form>        
        <script src="./Scripts/Checkout.js" defer></script>        
    </main>    
    <footer>
        <div class="footer">
            <div class="copyright">
                <p>&copy; Carewell Hospital</p>
            </div>
        </div>  
    </footer>
</body>
</html>
